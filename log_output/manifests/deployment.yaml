
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: writer
          image: log_output:1.10
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "writer.py"]
          volumeMounts:
            - name: shared-data
              mountPath: /data

        - name: reader
          image: log_output:1.10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: shared-data
              mountPath: /data

      volumes:
        - name: shared-data
          emptyDir: {}
