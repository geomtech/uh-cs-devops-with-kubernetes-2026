
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: the-course-project-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: the-course-project-svc
                port:
                  number: 1234
